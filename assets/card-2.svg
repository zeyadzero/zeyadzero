<svg xmlns="http://www.w3.org/2000/svg" width="440" height="170" viewBox="0 0 440 170" role="img"><defs><linearGradient id="cg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="440" y2="170"><stop offset="0" stop-color="#58a6ff"/><stop offset=".5" stop-color="#bc8cff"/><stop offset="1" stop-color="#3fb950"/><animateTransform attributeName="gradientTransform" type="rotate" from="0 220.0 85.0" to="360 220.0 85.0" dur="6s" repeatCount="indefinite"/></linearGradient></defs><style>text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;}</style><rect x="1.5" y="1.5" width="437" height="167" rx="14" fill="#161b22" stroke="url(#cg)" stroke-width="2.5"/><rect x="24" y="26" width="10" height="10" rx="2" fill="#3fb950"><animate attributeName="opacity" values="1;0.25" dur="1.2s" repeatCount="indefinite" calcMode="discrete"/></rect><text x="44" y="36" font-size="18" font-weight="700" fill="#e6edf3">Signed APT repo on GitHub Pages</text><text x="24" y="64" font-size="12.5" fill="#8b949e">A fully automated, GPG-signed Debian repository:</text><text x="24" y="82" font-size="12.5" fill="#8b949e">push a .deb, GitHub Actions rebuilds the index and</text><text x="24" y="100" font-size="12.5" fill="#8b949e">publishes it. Users just apt install.</text><rect x="24" y="130" width="53" height="22" rx="11" fill="#21262d"/><text x="50.5" y="145" text-anchor="middle" font-size="11" fill="#58a6ff">CI/CD</text><rect x="85" y="130" width="116" height="22" rx="11" fill="#21262d"/><text x="143.0" y="145" text-anchor="middle" font-size="11" fill="#58a6ff">GitHub Actions</text><rect x="209" y="130" width="39" height="22" rx="11" fill="#21262d"/><text x="228.5" y="145" text-anchor="middle" font-size="11" fill="#58a6ff">APT</text><rect x="256" y="130" width="39" height="22" rx="11" fill="#21262d"/><text x="275.5" y="145" text-anchor="middle" font-size="11" fill="#58a6ff">GPG</text><rect x="303" y="130" width="53" height="22" rx="11" fill="#21262d"/><text x="329.5" y="145" text-anchor="middle" font-size="11" fill="#58a6ff">Pages</text></svg>